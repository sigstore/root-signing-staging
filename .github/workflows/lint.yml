name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow files
        uses: reviewdog/action-actionlint@v1.80.8
        with:
          actionlint_flags: -color

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1

  actions-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify actions lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

